name: Compilar APK y Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Llave de firma (secreto KEYSTORE_BASE64)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          else
            echo "::warning::Falta el secreto KEYSTORE_BASE64: se usa una llave temporal y el APK no se instalará encima del anterior."
            keytool -genkeypair -keystore android/keystore/release.jks -alias cuentasdark -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass cuentasdark -keypass cuentasdark -dname "CN=Ciber Dark, O=Ciber Dark, C=MX"
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: flutter build apk
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log
      - name: Guardar log si falla (rama ci-logs)
        if: failure()
        shell: bash
        run: |
          tail -n 400 build.log > /tmp/build.log || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs && git rm -rfq . && cp /tmp/build.log build.log
          git add build.log && git commit -qm "log de compilación ${{ github.run_number }}" && git push -f origin ci-logs
      - name: Renombrar APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk CuentasDark.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk CuentasDark-celular-antiguo-32bits.apk
          sha256sum CuentasDark*.apk > SHA256.txt
          ls -la CuentasDark*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CuentasDark-apk
          path: |
            CuentasDark*.apk
            SHA256.txt
      - name: Publicar como "Release" para descargar fácil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuentas Dark v1.0.${{ github.run_number }}
          files: |
            CuentasDark.apk
            CuentasDark-celular-antiguo-32bits.apk
            SHA256.txt

  # Versión para la PC: CuentasDark-Setup.exe (instalador) y CuentasDark-PC-portable.zip, en el mismo Release.
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: flutter build windows
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Agregar runtime de Visual C++ (para PCs que no lo tienen)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") { Copy-Item "$env:WINDIR\System32\$d" $rel -ErrorAction Continue }
          Get-ChildItem $rel | Select-Object Name, Length | Format-Table
          if (-not (Get-ChildItem $rel -Recurse -Filter "*sqlite*.dll")) { Write-Warning "No veo sqlite3.dll en la carpeta de Release" }
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=1.0.${{ github.run_number }}" installer\CuentasDark.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath dist\CuentasDark-PC-portable.zip
          Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File "$env:RUNNER_TEMP\SHA256-PC.txt" -Encoding ascii
          Move-Item "$env:RUNNER_TEMP\SHA256-PC.txt" dist\SHA256-PC.txt
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: CuentasDark-windows
          path: dist/*
      - name: Agregar al Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuentas Dark v1.0.${{ github.run_number }}
          files: |
            dist/CuentasDark-Setup.exe
            dist/CuentasDark-PC-portable.zip
            dist/SHA256-PC.txt
